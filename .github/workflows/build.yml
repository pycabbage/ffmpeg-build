name: build

# PR create / sync triggered (opened, synchronize, reopened).
on:
  pull_request:
    types: [opened, synchronize, reopened]

# packages: write lets GITHUB_TOKEN push the builder image to ghcr.io for same-repo PRs.
# On FORKED PRs GITHUB_TOKEN is downgraded to read-only, so the registry login/push/cache steps
# are skipped (see the per-step `if:`/conditionals below) and the image is built locally instead.
permissions:
  contents: read
  packages: write

# One in-flight run per PR; cancel superseded pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # The full from-source build (toolchain + ~100 libs) is long. cache-to type=registry,mode=max
    # stores every layer in a ghcr.io :buildcache tag (no 10GB gha-cache cap that was evicting the
    # toolchain layers and forcing full rebuilds), so only the COLD first run is slow -- and that
    # cold run can approach the 6h hosted-runner ceiling. 360 is the maximum allowed job timeout.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Forked PRs get a read-only GITHUB_TOKEN: the GHCR login/push/cache-to steps below would
      # fail, so we gate them on this and build the image locally (load) for forks instead.
      - name: Determine if the PR is from a fork
        id: fork
        run: echo "is_fork=${{ github.event.pull_request.head.repo.full_name != github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.fork.outputs.is_fork == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract builder-image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha

      - name: Build the builder image (push + registry cache only on same-repo PRs)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Always load into the local docker daemon so the next step can run it by tag without a
          # registry round-trip; push to ghcr only when the token can write (same-repo PRs).
          load: true
          push: ${{ steps.fork.outputs.is_fork == 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: ${{ steps.fork.outputs.is_fork == 'false' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', github.repository) || '' }}

      - name: Compile FFmpeg inside the builder image
        # The image's ENTRYPOINT (scripts/build-ffmpeg.sh) downloads + builds + verifies FFmpeg
        # at run time and writes the relocatable bundle to the mounted /output. Run the image just
        # built (loaded locally), addressed by its first metadata tag (works for forks too).
        run: |
          mkdir -p "${{ github.workspace }}/out"
          docker run --rm \
            -v "${{ github.workspace }}/out:/output" \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "---- contents of out/ ----"
          ls -la "${{ github.workspace }}/out"

      - name: Upload FFmpeg bundle
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-pr${{ github.event.pull_request.number }}-linux-x86_64
          path: |
            out/ffmpeg
            out/ffprobe
            out/ffplay
            out/lib/**
            out/*.tar.gz
          if-no-files-found: error
          retention-days: 14
